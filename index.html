<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERIFICA.AI - Agente Híbrido com Transparência Total</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }
        
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .container {
            background-color: #1e293b; padding: 25px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 750px;
            display: flex; flex-direction: column; height: 85vh;
            animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        h1 { color: #38bdf8; margin-top: 0; text-align: center; font-size: 24px; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        
        .chat-container {
            flex: 1; background-color: #0f172a; border: 1px solid #334155;
            border-radius: 8px; padding: 15px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px;
            scroll-behavior: smooth;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message { 
            padding: 12px 16px; border-radius: 8px; max-width: 85%; 
            font-size: 14px; line-height: 1.5; 
            animation: slideUp 0.4s ease-out forwards;
        }
        .message.user { background-color: #38bdf8; color: #0f172a; align-self: flex-end; font-weight: 500; }
        .message.ai { background-color: #1e293b; color: #f8fafc; align-self: flex-start; border: 1px solid #334155; }
        
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        .pensando { animation: pulse 1.5s infinite ease-in-out; color: #38bdf8; font-style: italic; }

        .input-group { display: flex; gap: 10px; }
        textarea {
            flex: 1; height: 55px; padding: 12px; border-radius: 8px;
            border: 1px solid #334155; background-color: #0f172a; color: #fff;
            font-size: 14px; resize: none; transition: border-color 0.3s;
        }
        textarea:focus { border-color: #38bdf8; outline: none; }
        
        button {
            background-color: #38bdf8; color: #0f172a; border: none;
            padding: 0 20px; font-size: 15px; font-weight: bold; border-radius: 8px;
            cursor: pointer; transition: background 0.2s, transform 0.1s;
        }
        button:hover { background-color: #0ea5e9; }
        button:active { transform: scale(0.95); }

        .termometro {
            display: flex; justify-content: space-around; margin-top: 15px;
            background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid #334155;
        }
        .stat-item span { font-size: 11px; color: #94a3b8; display: block; text-transform: uppercase; margin-bottom: 4px; }
        .stat-item strong { font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 VERIFICA.AI</h1>
    <p class="subtitle">Arquitetura Híbrida: IA Generativa + Machine Learning (SVM) + Web Scraping</p>

    <div class="chat-container" id="chatContainer">
        <div class="message ai">
            Olá! Sou o agente investigador do <strong>VERIFICA.AI</strong>. Digite o que você quer checar. Se faltar algum detalhe importante, eu vou conversar com você antes de acionar nosso modelo matemático de detecção.
        </div>
    </div>

    <div class="input-group">
        <textarea id="campoTexto" placeholder="Ex: A maconha é legalizada?" onkeydown="checarEnter(event)"></textarea>
        <button onclick="enviarMensagem()" id="btnEnviar">Enviar</button>
    </div>
</div>

<script>
    let memoriaConversa = "";

    function checarEnter(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            enviarMensagem();
        }
    }

    function formatarTextoIA(texto) {
        return texto.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
    }

    async function enviarMensagem() {
        const campo = document.getElementById('campoTexto');
        const texto = campo.value.trim();
        const chatContainer = document.getElementById('chatContainer');
        const botao = document.getElementById('btnEnviar');

        if (!texto) return;

        chatContainer.innerHTML += `<div class="message user">${texto}</div>`;
        campo.value = '';
        chatContainer.scrollTop = chatContainer.scrollHeight;

        memoriaConversa = memoriaConversa ? memoriaConversa + " " + texto : texto;

        const idTemp = 'msg-' + Date.now();
        chatContainer.innerHTML += `<div class="message ai pensando" id="${idTemp}">⏳ [01s] Iniciando triagem da afirmação...</div>`;
        chatContainer.scrollTop = chatContainer.scrollHeight;
        botao.disabled = true;

        // Timer visual em tempo real para gerenciar expectativa e mostrar atividade
        let segundos = 1;
        const timerInterval = setInterval(() => {
            segundos++;
            const elementoPensando = document.getElementById(idTemp);
            if (elementoPensando) {
                let statusTexto = "⏳ Analisando...";
                if (segundos === 2) statusTexto = "🔍 Consultando fontes na web...";
                if (segundos === 4) statusTexto = "📊 Rodando modelo estatístico SVM...";
                if (segundos === 6) statusTexto = "🤖 Sintetizando laudo com IA...";
                if (segundos >= 8) statusTexto = "⚡ Finalizando veredito...";
                
                elementoPensando.innerHTML = `${statusTexto} (${segundos}s)`;
            }
        }, 1000);

        try {
            const resposta = await fetch("http://127.0.0.1:8000/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mensagem: memoriaConversa })
            });

            const dados = await resposta.json();
            clearInterval(timerInterval); // Para o timer

            const msgElemento = document.getElementById(idTemp);
            msgElemento.classList.remove('pensando');

            if (dados.origem === "agente_dialogo" || dados.origem === "erro") {
                msgElemento.innerHTML = formatarTextoIA(dados.texto);
            } 
            else if (dados.origem === "agente_verificacao") {
                memoriaConversa = ""; // Zera a memória de curto prazo após o sucesso
                const ml = dados.dados_ml;
                
                // Monta a lista de fontes web
                let htmlFontes = '';
                if (ml.fontes_lista && ml.fontes_lista.length > 0) {
                    const itensLista = ml.fontes_lista.map(fonte => {
                        const textoFonte = typeof fonte === 'object' ? JSON.stringify(fonte) : fonte;
                        return `<li style="margin-bottom: 6px;">${textoFonte}</li>`;
                    }).join('');

                    htmlFontes = `
                        <details style="margin-top: 12px; background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #334155;">
                            <summary style="cursor: pointer; color: #38bdf8; font-weight: bold; font-size: 13px; outline: none;">
                                🔍 Ver Fontes de Notícias Coletadas (${ml.fontes_cruzadas})
                            </summary>
                            <ul style="margin: 10px 0 0 0; padding-left: 20px; font-size: 11px; color: #cbd5e1; line-height: 1.4;">
                                ${itensLista}
                            </ul>
                        </details>
                    `;
                }

                // Novo Botão de Transparência Total: Detalhes do Pipeline Técnico
                const htmlDetalhesTecnicos = `
                    <details style="margin-top: 8px; background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #334155;">
                        <summary style="cursor: pointer; color: #4ade80; font-weight: bold; font-size: 13px; outline: none;">
                            ⚙️ Ver Detalhes do Pipeline (Transparência Técnica)
                        </summary>
                        <div style="margin-top: 10px; font-size: 11px; color: #cbd5e1; line-height: 1.5; font-family: monospace;">
                            • <strong>Modelo Estatístico:</strong> SVM (TF-IDF Vectorizer)<br>
                            • <strong>Score Verdadeiro (Matemático):</strong> ${ml.verdadeiro}%<br>
                            • <strong>Score Falso (Matemático):</strong> ${ml.falso}%<br>
                            • <strong>Agente de Contexto:</strong> Gemini Flash (Google AI Studio)<br>
                            • <strong>Web Scraping:</strong> Google News RSS Parser Ativo<br>
                            • <strong>Estado de Memória:</strong> Limpo após veredito
                        </div>
                    </details>
                `;

                msgElemento.innerHTML = `
                    <div style="margin-bottom: 10px;">
                        ${formatarTextoIA(dados.texto)}
                    </div>
                    
                    <div class="termometro">
                        <div class="stat-item">
                            <span>Veracidade (SVM)</span>
                            <strong style="color: #4ade80;">${ml.verdadeiro}%</strong>
                        </div>
                        <div class="stat-item">
                            <span>Fake (SVM)</span>
                            <strong style="color: #f87171;">${ml.falso}%</strong>
                        </div>
                        <div class="stat-item">
                            <span>Fontes Lidas</span>
                            <strong style="color: #38bdf8;">${ml.fontes_cruzadas}</strong>
                        </div>
                    </div>
                    
                    ${htmlFontes}
                    ${htmlDetalhesTecnicos}
                `;
            }

        } catch (erro) {
            clearInterval(timerInterval);
            const msgElemento = document.getElementById(idTemp);
            msgElemento.classList.remove('pensando');
            msgElemento.innerHTML = `❌ Erro de conexão com o servidor local. Verifique se o Uvicorn está rodando.`;
            console.error(erro);
        } finally {
            botao.disabled = false;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    }
</script>

</body>
</html>
