<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERIFICA.AI - Agente Híbrido com Transparência Total</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body onload="carregarUsuario()">

<div class="container">
    <h1>🤖 VERIFICA.AI</h1>
    <p class="subtitle">Arquitetura Híbrida: IA Generativa + Machine Learning (SVM) + Web Scraping</p>

    <div class="user-bar">
        <label for="nomeUsuario" style="font-size: 13px; color: #94a3b8;">👤 Identificação:</label>
        <input type="text" id="nomeUsuario" placeholder="Digite seu nome (Ex: Guilherme)" onblur="trocarUsuario()" onkeypress="verificarEnterUsuario(event)">
    </div>

    <div class="chat-container" id="chatContainer">
        <!-- Chat gerado via JavaScript -->
    </div>

    <div class="input-group">
        <textarea id="campoTexto" placeholder="Digite a afirmação que deseja checar..." onkeydown="checarEnter(event)"></textarea>
        
        <!-- NOVO: Botão de Microfone -->
        <button id="btnVoz" onclick="iniciarReconhecimentoVoz()" class="btn-voz" title="Falar">🎙️</button>
        
        <button onclick="enviarMensagem()" id="btnEnviar">Enviar</button>
        <button onclick="limparConversa()" class="btn-limpar" title="Limpar Histórico">🗑️</button>
    </div>
</div>

<script src="js/script.js"></script>

</body>
</html>
